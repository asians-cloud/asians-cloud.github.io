{{- /*
  Nil-safe: if the user doesn't define an autoscaling block at all,
  .Values.autoscaling is nil and `.Values.autoscaling.enabled` errors
  out on stricter helm versions. `default dict` coerces nil to an
  empty map so .enabled returns nil (treated as false by `if`).

  HPA is also auto-injected by the cluster's Kyverno inject-hpa policy,
  so most releases leave this block unset — that's the default-off path.
*/ -}}
{{- $autoscaling := .Values.autoscaling | default dict -}}
{{- if $autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "django.fullname" . }}
  labels:
    {{- include "django.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "django.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
  {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
{{- end }}
